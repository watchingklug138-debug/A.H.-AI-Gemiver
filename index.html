<!DOCTYPE html>
<html>

<head>

    <title>A.H. AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="sidebar">

    <h2>A.H. AI</h2>

    <button class="new-chat">
        + New Chat
    </button>

    <div class="modes">

        <h3>STYLE</h3>

        <button>Fast</button>
        <button>Thinking</button>
        <button>Pro</button>

    </div>

</div>

<div class="main">

    <div class="top-bar">

        <div class="logo">
            A.H. AI
        </div>

        <div class="status">
            Online
        </div>

    </div>

    <div class="welcome">

        <h1>Hello.</h1>

        <p>
            Welcome to A.H. AI.
        </p>

    </div>

    <div id="chat-box"></div>

    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Message A.H. AI..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
